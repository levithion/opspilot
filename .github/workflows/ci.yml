name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (with coverage gate)
        run: pytest --cov=opspilot --cov-report=term-missing --cov-fail-under=85
      - name: Retrieval quality gate
        run: |
          python -m opspilot.rag.evaluate --json > retrieval-report.json
          python - <<'PY'
          import json, sys
          r = json.load(open("retrieval-report.json"))
          print({k: r[k] for k in ("questions", "hit_at_1", "hit_at_4", "mrr", "leaks")})
          sys.exit(0 if r["hit_at_4"] >= 0.9 and r["leaks"] == 0 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: retrieval-report
          path: retrieval-report.json

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: opspilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name op -p 8000:8000 -e OPSPILOT_LLM_PROVIDER=mock opspilot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break || sleep 2; done
          curl -fs localhost:8000/ready
          docker rm -f op
